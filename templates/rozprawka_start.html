{% extends "base.html" %}

{% block content %}

<h2>Rozprawka</h2>
<p>Podaj swoje imię</p>

<form action="/start_rozprawka" method="POST">

    <input 
        type="text" 
        name="nick"
        placeholder="Twój nick"
        required
        minlength="2"
        maxlength="20"
    >

    <button type="submit">Start</button>

</form>

<br>

<a href="/">
    <button type="button">Powrót</button>
</a>

{% endblock %}
